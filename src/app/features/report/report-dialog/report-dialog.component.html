
<kirby-page-title>{{reportTitle}}</kirby-page-title>

<kirby-item>
  <p class="kirby-item-title">Eggs gathered</p>
  <div slot="end" class="increment-container">
    <app-increment (add)="addEggs(1)" (subtract)="addEggs(-1)"></app-increment>
    <kirby-flag themeColor="success">{{report.layedEggs}}</kirby-flag>
  </div>
</kirby-item>
<kirby-item>
  <kirby-checkbox slot="end" [(checked)]="refillFood">Food refilled</kirby-checkbox>
</kirby-item>

<kirby-modal-footer>
  @if(!isNewReport) {
    <button kirby-button (click)="deleteReport()">Delete</button>
  }
  <button kirby-button (click)="submitEggs()">Submit</button>
</kirby-modal-footer>
